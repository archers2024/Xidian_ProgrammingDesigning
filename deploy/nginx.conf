# 高校学生活动全流程管理系统 - Nginx 站点配置
# 目标位置: /etc/nginx/sites-available/activity-system
# 场景: 大陆公网 IP + HTTP + 2核2G 学生机
# setup.sh 会自动安装本文件、启用站点并移除默认站点。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/activity-system/web;
    index index.html;

    client_max_body_size 25m;
    access_log /var/log/nginx/activity-access.log;
    error_log  /var/log/nginx/activity-error.log;

    # 首屏 JS 约 1.1MB、CSS 约 354KB，1M 带宽必须开 gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml
               application/xml+rss image/svg+xml;

    # Vite 带 hash 的静态资源可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端以根路径部署；proxy_pass 结尾的 / 表示用 / 替换 location 匹配到的 /api/v1/
    # 例如 /api/v1/admin/activity/list -> /admin/activity/list
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vue Router 使用 createWebHistory，深链刷新必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
