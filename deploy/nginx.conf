# Install after replacing __DOMAIN__, __CERT__, __KEY__. No plaintext production fallback.
log_format campus '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
server { listen 80; listen [::]:80; server_name __DOMAIN__; return 308 https://__DOMAIN__$request_uri; }
server {
 listen 443 ssl; listen [::]:443 ssl; server_name __DOMAIN__;
 ssl_certificate __CERT__; ssl_certificate_key __KEY__;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /opt/activity-system/current/web; index index.html;
 client_max_body_size 21m;
 access_log /var/log/nginx/campus-access.log campus;
 error_log /var/log/nginx/campus-error.log warn;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 gzip on; gzip_comp_level 5; gzip_vary on; gzip_min_length 1024;
 gzip_types text/css application/json application/javascript image/svg+xml;
 location /assets/ { expires 30d; try_files $uri =404; }
 location /api/v1/ {
  proxy_pass http://127.0.0.1:8080/;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 5s; proxy_read_timeout 60s;
 }
    location = /index.html { expires -1; }
 location / { try_files $uri $uri/ /index.html; }
}
